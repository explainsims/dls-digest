<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Signals in the noise — The DLS Digest</title>
  <meta name="description" content="A curation of what is happening in AI and Education Technology today.">
  <style>
    :root {
      --bg: #f6f1e7; --ink: #1f1b16; --muted: #6b6358;
      --rule: #d9cfbe; --accent: #7a4a2b;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #14110d; --ink: #ece4d3; --muted: #9a9183;
        --rule: #2c2620; --accent: #d8a676;
      }
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      background: var(--bg); color: var(--ink);
      font-family: Georgia, "Times New Roman", serif;
      line-height: 1.55; min-height: 100vh;
      display: flex; flex-direction: column; padding: 3rem 1.5rem;
    }
    main { max-width: 36rem; margin: auto; text-align: center; }
    .eyebrow {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      text-transform: uppercase; letter-spacing: 0.22em;
      font-size: 0.72rem; color: var(--muted); margin-bottom: 1.25rem;
    }
    h1 {
      font-style: italic; font-weight: 400;
      font-size: clamp(2rem, 6vw, 3.25rem);
      line-height: 1.1; margin: 0 0 1rem;
    }
    .deck {
      font-style: italic; color: var(--muted);
      font-size: 1.1rem; margin: 0 auto 2.5rem; max-width: 28rem;
    }
    .body {
      border-top: 1px solid var(--rule);
      padding-top: 1.75rem; font-size: 1rem;
    }
    .body a {
      color: var(--accent); text-decoration: underline; text-underline-offset: 2px;
    }
    footer {
      margin-top: 3rem; text-align: center;
      font-size: 0.8rem; color: var(--muted);
    }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">The DLS Digest</p>
    <h1>Signals in the noise</h1>
    <p class="deck">A curation of what is happening in AI and Education Technology today.</p>
    <p class="body">The full site is being prepared. Live at <a href="https://explainsims.com/DLS-Digest/">explainsims.com/DLS-Digest</a>.</p>
  </main>
  <footer>Curated by Lennox Meldrum, Digital Learning Specialist, SSIS.</footer>
</body>
</html>
